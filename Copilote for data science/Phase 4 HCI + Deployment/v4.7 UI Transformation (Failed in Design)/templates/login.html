{% extends "base.html" %}
{% block title %}Login — Data Science Copilot{% endblock %}
{% block body %}
<div class="auth-wrapper">
    <div class="auth-card">
        <div class="auth-logo">🤴</div>
        <h1 class="auth-title">Data Science Copilot</h1>
        <p class="auth-subtitle">Sign in to your account</p>

        <div id="auth-error" class="auth-error" style="display:none;"></div>

        <form id="login-form" onsubmit="return handleLogin(event)">
            <div class="form-group">
                <label for="login_id">Username or Email</label>
                <input type="text" id="login_id" name="login_id" placeholder="Enter username or email" required
                    autofocus>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Enter password" required>
            </div>
            <button type="submit" class="btn-primary" id="login-btn">
                <span class="btn-text">Sign In</span>
                <span class="btn-loader" style="display:none;">⏳</span>
            </button>
        </form>

        <p class="auth-footer">
            Don't have an account? <a href="/register">Create one</a>
        </p>
    </div>
</div>
{% endblock %}
{% block scripts %}
<script>
    async function handleLogin(e) {
        e.preventDefault();
        const btn = document.getElementById('login-btn');
        const errDiv = document.getElementById('auth-error');
        btn.querySelector('.btn-text').style.display = 'none';
        btn.querySelector('.btn-loader').style.display = 'inline';
        btn.disabled = true;
        errDiv.style.display = 'none';

        try {
            const res = await fetch('/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    login_id: document.getElementById('login_id').value,
                    password: document.getElementById('password').value,
                }),
            });
            const data = await res.json();
            if (res.ok) {
                window.location.href = '/dashboard';
            } else {
                errDiv.textContent = data.error || 'Login failed';
                errDiv.style.display = 'block';
            }
        } catch (err) {
            errDiv.textContent = 'Network error. Please try again.';
            errDiv.style.display = 'block';
        } finally {
            btn.querySelector('.btn-text').style.display = 'inline';
            btn.querySelector('.btn-loader').style.display = 'none';
            btn.disabled = false;
        }
    }
</script>
{% endblock %}
